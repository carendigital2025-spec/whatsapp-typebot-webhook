<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minha Base | ADCred</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f6f9;
      color: #162033;
      min-height: 100vh;
    }

    .topo {
      background: #071426;
      color: #ffffff;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    .topo h1 {
      font-size: 22px;
    }

    .topo p {
      font-size: 13px;
      color: #b9c6d5;
      margin-top: 4px;
    }

    .topo a {
      color: #071426;
      background: #d7aa4b;
      text-decoration: none;
      font-weight: 700;
      padding: 10px 16px;
      border-radius: 9px;
      font-size: 14px;
    }

    .conteudo {
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
      padding: 28px 20px 40px;
    }

    .cabecalho-secao {
      margin-bottom: 22px;
    }

    .cabecalho-secao h2 {
      font-size: 26px;
      margin-bottom: 6px;
    }

    .cabecalho-secao p {
      color: #6d788a;
      font-size: 14px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .card {
      background: #ffffff;
      border-radius: 14px;
      padding: 22px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
      border: 1px solid #e7ebf0;
    }

    .card span {
      display: block;
      color: #7a8697;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .card strong {
      font-size: 30px;
      color: #10233e;
    }

    .filtros {
      background: #ffffff;
      padding: 18px;
      border-radius: 14px;
      margin-bottom: 20px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.05);
      border: 1px solid #e7ebf0;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    .campo-pesquisa {
      flex: 1;
      min-width: 220px;
    }

    .campo-pesquisa input {
      width: 100%;
      height: 44px;
      border: 1px solid #d6dde6;
      border-radius: 9px;
      padding: 0 14px;
      font-size: 14px;
      outline: none;
    }

    .campo-pesquisa input:focus {
      border-color: #d7aa4b;
      box-shadow: 0 0 0 3px rgba(215, 170, 75, 0.14);
    }

    select {
      height: 44px;
      border: 1px solid #d6dde6;
      border-radius: 9px;
      padding: 0 12px;
      background: #ffffff;
      color: #26364c;
      font-size: 14px;
      outline: none;
    }

    .botao-atualizar {
      height: 44px;
      border: 0;
      border-radius: 9px;
      padding: 0 17px;
      background: #102b4a;
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .botao-atualizar:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    .tabela-box {
      background: #ffffff;
      border-radius: 14px;
      border: 1px solid #e7ebf0;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.05);
      overflow: hidden;
    }

    .tabela-scroll {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 980px;
    }

    thead {
      background: #f6f8fb;
    }

    th {
      text-align: left;
      padding: 14px 16px;
      font-size: 12px;
      color: #5f6b7c;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      border-bottom: 1px solid #e7ebf0;
    }

    td {
      padding: 15px 16px;
      font-size: 14px;
      border-bottom: 1px solid #edf0f4;
      vertical-align: middle;
    }

    tbody tr:hover {
      background: #fafbfd;
    }

    .nome {
      font-weight: 700;
      color: #142033;
    }

    .telefone {
      font-family: Consolas, monospace;
      color: #3f4d5f;
    }

    .status {
      display: inline-block;
      padding: 6px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }

    .status.ativo {
      background: #e8f8ee;
      color: #1e6d3d;
    }

    .status.descadastrado {
      background: #fdecec;
      color: #9b2c2c;
    }

    .sim {
      color: #1e6d3d;
      font-weight: 700;
    }

    .nao {
      color: #9b2c2c;
      font-weight: 700;
    }

    .rodape-tabela {
      padding: 14px 16px;
      color: #6c7788;
      font-size: 13px;
      background: #fbfcfd;
    }

    .mensagem {
      padding: 28px;
      text-align: center;
      color: #6b7688;
    }

    .erro {
      color: #a52222;
    }

    @media (max-width: 850px) {
      .cards {
        grid-template-columns: 1fr;
      }

      .topo {
        align-items: flex-start;
      }

      .conteudo {
        padding: 20px 12px 32px;
      }
    }
  </style>
</head>

<body>

  <header class="topo">
    <div>
      <h1>ADCred Solução Financeira</h1>
      <p>Minha Base de Leads</p>
    </div>

    <a href="/painel.html">
      Voltar ao painel
    </a>
  </header>

  <main class="conteudo">

    <section class="cabecalho-secao">
      <h2>Minha Base</h2>
      <p>
        Contatos captados com registro de consentimento.
      </p>
    </section>

    <section class="cards">

      <div class="card">
        <span>Total de leads</span>
        <strong id="totalLeads">0</strong>
      </div>

      <div class="card">
        <span>Ativos</span>
        <strong id="totalAtivos">0</strong>
      </div>

      <div class="card">
        <span>Descadastrados</span>
        <strong id="totalDescadastrados">0</strong>
      </div>

    </section>

    <section class="filtros">

      <div class="campo-pesquisa">
        <input
          type="text"
          id="pesquisa"
          placeholder="Pesquisar por nome ou WhatsApp"
        />
      </div>

      <select id="filtroStatus">
        <option value="todos">Todos os status</option>
        <option value="ativo">Ativos</option>
        <option value="descadastrado">Descadastrados</option>
      </select>

      <button
        id="botaoAtualizar"
        class="botao-atualizar"
        type="button"
      >
        Atualizar
      </button>

    </section>

    <section class="tabela-box">

      <div class="tabela-scroll">

        <table>
          <thead>
            <tr>
              <th>Nome</th>
              <th>WhatsApp</th>
              <th>Status</th>
              <th>Consentimento</th>
              <th>Origem</th>
              <th>Data do cadastro</th>
            </tr>
          </thead>

          <tbody id="corpoTabela">
            <tr>
              <td colspan="6">
                <div class="mensagem">
                  Carregando contatos...
                </div>
              </td>
            </tr>
          </tbody>

        </table>

      </div>

      <div
        id="rodapeTabela"
        class="rodape-tabela"
      >
        0 contatos exibidos
      </div>

    </section>

  </main>

  <script>
    const totalLeads =
      document.getElementById("totalLeads");

    const totalAtivos =
      document.getElementById("totalAtivos");

    const totalDescadastrados =
      document.getElementById("totalDescadastrados");

    const pesquisa =
      document.getElementById("pesquisa");

    const filtroStatus =
      document.getElementById("filtroStatus");

    const botaoAtualizar =
      document.getElementById("botaoAtualizar");

    const corpoTabela =
      document.getElementById("corpoTabela");

    const rodapeTabela =
      document.getElementById("rodapeTabela");

    let leads = [];


    function formatarTelefone(telefone) {
      if (!telefone) return "-";

      let numero =
        String(telefone).replace(/\D/g, "");

      if (numero.startsWith("55")) {
        numero = numero.substring(2);
      }

      if (numero.length === 11) {
        return (
          "(" +
          numero.substring(0, 2) +
          ") " +
          numero.substring(2, 7) +
          "-" +
          numero.substring(7)
        );
      }

      if (numero.length === 10) {
        return (
          "(" +
          numero.substring(0, 2) +
          ") " +
          numero.substring(2, 6) +
          "-" +
          numero.substring(6)
        );
      }

      return telefone;
    }


    function formatarData(data) {
      if (!data) return "-";

      const objetoData =
        new Date(data);

      if (
        Number.isNaN(
          objetoData.getTime()
        )
      ) {
        return "-";
      }

      return objetoData.toLocaleString(
        "pt-BR",
        {
          dateStyle: "short",
          timeStyle: "short"
        }
      );
    }


    function escaparHtml(texto) {
      return String(texto || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    function atualizarContadores() {
      const ativos =
        leads.filter(
          lead =>
            lead.status === "ativo"
        ).length;

      const descadastrados =
        leads.filter(
          lead =>
            lead.status === "descadastrado"
        ).length;

      totalLeads.textContent =
        leads.length;

      totalAtivos.textContent =
        ativos;

      totalDescadastrados.textContent =
        descadastrados;
    }


    function obterLeadsFiltrados() {
      const termo =
        pesquisa.value
          .trim()
          .toLowerCase();

      const status =
        filtroStatus.value;

      return leads.filter(lead => {

        const nome =
          String(
            lead.nome || ""
          ).toLowerCase();

        const telefone =
          String(
            lead.telefone || ""
          ).toLowerCase();

        const correspondePesquisa =
          !termo ||
          nome.includes(termo) ||
          telefone.includes(termo);

        const correspondeStatus =
          status === "todos" ||
          lead.status === status;

        return (
          correspondePesquisa &&
          correspondeStatus
        );
      });
    }


    function renderizarTabela() {
      const lista =
        obterLeadsFiltrados();

      if (lista.length === 0) {

        corpoTabela.innerHTML = `
          <tr>
            <td colspan="6">
              <div class="mensagem">
                Nenhum contato encontrado.
              </div>
            </td>
          </tr>
        `;

        rodapeTabela.textContent =
          "0 contatos exibidos";

        return;
      }

      corpoTabela.innerHTML =
        lista
          .map(lead => {

            const status =
              lead.status ===
              "descadastrado"
                ? "descadastrado"
                : "ativo";

            const textoStatus =
              status ===
              "descadastrado"
                ? "Descadastrado"
                : "Ativo";

            const consentimento =
              lead.consentimento === true
                ? `<span class="sim">Sim</span>`
                : `<span class="nao">Não</span>`;

            return `
              <tr>

                <td class="nome">
                  ${escaparHtml(
                    lead.nome || "-"
                  )}
                </td>

                <td class="telefone">
                  ${escaparHtml(
                    formatarTelefone(
                      lead.telefone
                    )
                  )}
                </td>

                <td>
                  <span
                    class="status ${status}"
                  >
                    ${textoStatus}
                  </span>
                </td>

                <td>
                  ${consentimento}
                </td>

                <td>
                  ${escaparHtml(
                    lead.origem ||
                    "-"
                  )}
                </td>

                <td>
                  ${escaparHtml(
                    formatarData(
                      lead.criadoEm
                    )
                  )}
                </td>

              </tr>
            `;
          })
          .join("");

      rodapeTabela.textContent =
        `${lista.length} contato(s) exibido(s)`;
    }


    async function carregarLeads() {

      botaoAtualizar.disabled = true;
      botaoAtualizar.textContent =
        "Atualizando...";

      try {

        const resposta =
          await fetch(
            "/api/leads",
            {
              method: "GET",
              credentials: "same-origin",
              cache: "no-store"
            }
          );

        const tipoConteudo =
          resposta.headers.get(
            "content-type"
          ) || "";

        if (
          !tipoConteudo.includes(
            "application/json"
          )
        ) {
          throw new Error(
            "Resposta inválida do servidor."
          );
        }

        const dados =
          await resposta.json();

        if (
          resposta.status === 401
        ) {
          window.location.href =
            "/painel.html";

          return;
        }

        if (
          !resposta.ok ||
          !dados.ok
        ) {
          throw new Error(
            dados.erro ||
            "Não foi possível carregar os leads."
          );
        }

        leads =
          Array.isArray(dados.leads)
            ? dados.leads
            : [];

        atualizarContadores();
        renderizarTabela();

      } catch (erro) {

        console.error(
          "Erro ao carregar leads:",
          erro
        );

        corpoTabela.innerHTML = `
          <tr>
            <td colspan="6">
              <div class="mensagem erro">
                ${
                  escaparHtml(
                    erro.message ||
                    "Não foi possível carregar os contatos."
                  )
                }
              </div>
            </td>
          </tr>
        `;

        rodapeTabela.textContent =
          "Erro ao carregar contatos";

      } finally {

        botaoAtualizar.disabled = false;

        botaoAtualizar.textContent =
          "Atualizar";
      }
    }


    pesquisa.addEventListener(
      "input",
      renderizarTabela
    );

    filtroStatus.addEventListener(
      "change",
      renderizarTabela
    );

    botaoAtualizar.addEventListener(
      "click",
      carregarLeads
    );


    carregarLeads();
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ADCred - Painel de Campanhas</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 0;
    }

    .topo {
      background: #111827;
      color: white;
      padding: 22px;
      text-align: center;
    }

    .container {
      max-width: 900px;
      margin: 35px auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
    }

    input, select {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      margin-bottom: 18px;
      box-sizing: border-box;
    }

    button {
      background: #111827;
      color: white;
      border: none;
      padding: 14px 22px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    .status {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .numero {
      background: #f4f6f8;
      padding: 18px;
      border-radius: 8px;
      text-align: center;
    }

    .numero strong {
      display: block;
      font-size: 25px;
      margin-bottom: 5px;
    }
  </style>
</head>

<body>

  <div class="topo">
    <h1>ADCred</h1>
    <p>Painel de Campanhas</p>
  </div>

  <div class="container">

    <div class="card">
      <h2>Nova campanha</h2>

      <label>Nome da campanha</label>
      <input
        type="text"
        placeholder="Ex.: Campanha FGTS Setembro"
      >

      <label>Importar lista de contatos</label>
      <input
        type="file"
        accept=".csv"
      >

      <label>Template do WhatsApp</label>
      <select>
        <option>Selecione um template</option>
      </select>

      <button type="button">
        Preparar campanha
      </button>
    </div>

    <div class="card">
      <h2>Status da campanha</h2>

      <div class="status">

        <div class="numero">
          <strong>0</strong>
          Contatos
        </div>

        <div class="numero">
          <strong>0</strong>
          Enviados
        </div>

        <div class="numero">
          <strong>0</strong>
          Respondidos
        </div>

        <div class="numero">
          <strong>0</strong>
          Descadastrados
        </div>

      </div>
    </div>

  </div>

</body>
</html>s

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Conversas | ADCred</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f3f5f8;
      color: #1f2937;
    }

    header {
      height: 70px;
      background: #111827;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px;
    }

    header h1 {
      font-size: 22px;
    }

    .voltar {
      color: white;
      text-decoration: none;
      background: #273244;
      padding: 10px 16px;
      border-radius: 7px;
    }

    .container {
      max-width: 1450px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .titulo {
      margin-bottom: 20px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 15px;
    }

    .titulo h2 {
      font-size: 28px;
      margin-bottom: 5px;
    }

    .titulo p {
      color: #6b7280;
    }

    .conexao {
      font-size: 12px;
      color: #6b7280;
    }

    .chat {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,.08);

      display: grid;
      grid-template-columns: 380px 1fr;

      height: 680px;
    }

    .clientes {
      border-right: 1px solid #e5e7eb;
      overflow-y: auto;
    }

    .busca {
      padding: 15px;
      border-bottom: 1px solid #e5e7eb;

      position: sticky;
      top: 0;

      background: white;
      z-index: 2;
    }

    .busca input {
      width: 100%;
      padding: 12px;

      border: 1px solid #d1d5db;
      border-radius: 8px;

      outline: none;
    }

    .cliente {
      padding: 15px 17px;
      border-bottom: 1px solid #f0f0f0;

      cursor: pointer;

      display: flex;
      gap: 12px;
      align-items: center;
    }

    .cliente:hover {
      background: #f8fafc;
    }

    .cliente.ativo {
      background: #eef4ff;
    }

    .avatar {
      width: 45px;
      height: 45px;

      background: #1f2937;
      color: white;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      font-weight: bold;
      flex-shrink: 0;
    }

    .dados-cliente {
      min-width: 0;
      flex: 1;
    }

    .linha-nome {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dados-cliente strong {
      display: block;
      flex: 1;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dados-cliente span.preview {
      display: block;

      font-size: 13px;
      color: #6b7280;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;

      margin-top: 5px;
    }

    .meta-cliente {
      display: flex;
      align-items: center;
      gap: 7px;

      margin-top: 6px;

      font-size: 11px;
      color: #9ca3af;
    }

    .badge {
      min-width: 20px;
      height: 20px;

      padding: 0 6px;

      border-radius: 999px;

      background: #16a34a;
      color: white;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      font-size: 11px;
      font-weight: bold;
    }

    .status-mini {
      padding: 3px 7px;

      border-radius: 999px;

      background: #f3f4f6;
      color: #4b5563;
    }

    .modo-mini {
      padding: 3px 7px;

      border-radius: 999px;

      font-weight: bold;
    }

    .modo-bot {
      background: #e0f2fe;
      color: #0369a1;
    }

    .modo-humano {
      background: #fef3c7;
      color: #92400e;
    }

    .conversa {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .cabecalho-conversa {
      min-height: 82px;

      border-bottom: 1px solid #e5e7eb;

      display: flex;
      align-items: center;

      padding: 10px 20px;
      gap: 12px;
    }

    .cabecalho-info {
      min-width: 0;
      flex: 1;
    }

    .cabecalho-info strong {
      display: inline-block;
      max-width: 100%;
    }

    .cabecalho-info span {
      display: block;

      font-size: 13px;
      color: #6b7280;

      margin-top: 3px;
    }

    .modo-atual {
      margin-top: 6px;
      display: inline-block;
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: bold;
    }

    .acoes-cabecalho {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .acoes-cabecalho select,
    .acoes-cabecalho button {
      height: 36px;

      border: 1px solid #d1d5db;
      border-radius: 7px;

      background: white;

      padding: 0 10px;
    }

    .acoes-cabecalho button {
      cursor: pointer;
    }

    #botaoModo {
      font-weight: bold;
    }

    #botaoModo.assumir {
      background: #111827;
      color: white;
      border-color: #111827;
    }

    #botaoModo.devolver {
      background: #0284c7;
      color: white;
      border-color: #0284c7;
    }

    .mensagens {
      flex: 1;

      background: #f7f8fa;

      padding: 25px;

      overflow-y: auto;

      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .vazio {
      margin: auto;
      text-align: center;
      color: #6b7280;
    }

    .vazio h3 {
      color: #374151;
      margin-bottom: 8px;
    }

    .mensagem {
      max-width: 72%;

      padding: 11px 14px;

      border-radius: 10px;

      line-height: 1.4;
      font-size: 14px;

      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .cliente-msg {
      background: white;

      align-self: flex-start;

      border: 1px solid #e5e7eb;
    }

    .atendente-msg {
      background: #d9fdd3;
      align-self: flex-end;
    }

    .hora {
      display: block;

      font-size: 10px;
      color: #6b7280;

      margin-top: 5px;

      text-align: right;
    }

    .resposta {
      border-top: 1px solid #e5e7eb;

      padding: 15px;

      display: flex;
      gap: 10px;

      background: white;
    }

    .resposta textarea {
      flex: 1;

      resize: none;

      height: 48px;
      max-height: 120px;

      border: 1px solid #d1d5db;
      border-radius: 8px;

      padding: 12px;

      outline: none;
    }

    .resposta button {
      border: 0;

      background: #1f2937;
      color: white;

      padding: 0 22px;

      border-radius: 8px;

      font-weight: bold;

      cursor: pointer;
    }

    .resposta button:disabled,
    .resposta textarea:disabled,
    .acoes-cabecalho button:disabled,
    .acoes-cabecalho select:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .erro-topo {
      display: none;

      padding: 8px 14px;

      background: #fef2f2;
      color: #991b1b;

      font-size: 12px;

      border-bottom: 1px solid #fecaca;
    }

    @media (max-width: 900px) {
      .chat {
        grid-template-columns: 330px 1fr;
      }

      .acoes-cabecalho {
        max-width: 320px;
      }
    }

    @media (max-width: 800px) {
      .chat {
        grid-template-columns: 1fr;
      }

      .clientes {
        display: none;
      }

      .cabecalho-conversa {
        align-items: flex-start;
      }

      .acoes-cabecalho {
        max-width: 250px;
      }

      .acoes-cabecalho select {
        max-width: 140px;
      }
    }
     /* ======================================================
       CORREÇÃO DO LAYOUT DO CHAT
       ====================================================== */

    html,
    body {
      height: 100%;
    }

    body {
      overflow: hidden;
    }

    .container {
      height: calc(100vh - 70px);
      max-width: 1450px;
      margin: 0 auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
    }

    .titulo {
      flex: 0 0 auto;
      margin-bottom: 18px;
    }

    .chat {
      flex: 1;
      min-height: 0;
      height: auto;
      max-height: none;
      overflow: hidden;

      display: grid;
      grid-template-columns: 380px minmax(0, 1fr);
    }

    .clientes {
      height: 100%;
      min-height: 0;
      overflow-y: auto;
    }

    .conversa {
      height: 100%;
      min-height: 0;
      overflow: hidden;

      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
    }

    .erro-topo {
      flex-shrink: 0;
    }

    .cabecalho-conversa {
      position: relative;
      z-index: 5;

      min-height: 82px;
      height: auto;

      background: white;

      flex-shrink: 0;
    }

    .mensagens {
      min-height: 0;
      height: 100%;

      overflow-x: hidden;
      overflow-y: auto;

      padding: 22px 26px;

      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 10px;
    }

    .mensagem {
      width: fit-content;
      min-width: 70px;
      max-width: min(70%, 650px);

      height: auto;
      min-height: 0;

      padding: 10px 12px;

      flex: 0 0 auto;

      line-height: 1.35;

      white-space: pre-wrap;
      overflow-wrap: break-word;
      word-break: break-word;
    }

    .cliente-msg {
      align-self: flex-start;
    }

    .atendente-msg {
      align-self: flex-end;
    }

    .hora {
      margin-top: 4px;
    }

    .resposta {
      position: relative;
      z-index: 5;

      flex-shrink: 0;

      min-height: 78px;

      background: white;
    }

    .resposta textarea {
      min-height: 48px;
      height: 48px;
    }

    @media (max-width: 900px) {
      .chat {
        grid-template-columns: 320px minmax(0, 1fr);
      }

      .mensagem {
        max-width: 80%;
      }
    }
  
  </style>
</head>

<body>

<header>
  <h1>ADCred | Atendimento</h1>

  <a
    class="voltar"
    href="/painel.html"
  >
    Voltar ao painel
  </a>
</header>


<div class="container">

  <div class="titulo">

    <div>
      <h2>Conversas</h2>

      <p>
        Atendimento dos clientes pelo WhatsApp
      </p>
    </div>

    <div
      class="conexao"
      id="estadoAtualizacao"
    >
      Atualização automática ativa
    </div>

  </div>


  <div class="chat">

    <div class="clientes">

      <div class="busca">

        <input
          type="text"
          id="buscarCliente"
          placeholder="Buscar cliente ou telefone..."
        >

      </div>

      <div id="listaClientes">

        <div
          style="
            padding:25px;
            text-align:center;
            color:#6b7280;
          "
        >
          Carregando conversas...
        </div>

      </div>

    </div>


    <div class="conversa">

      <div
        class="erro-topo"
        id="erroTopo"
      ></div>


      <div class="cabecalho-conversa">

        <div
          class="avatar"
          id="avatarConversa"
        >
          ?
        </div>


        <div class="cabecalho-info">

          <strong id="nomeConversa">
            Selecione uma conversa
          </strong>

          <span id="telefoneConversa">
            WhatsApp
          </span>

          <div
            id="modoAtual"
            class="modo-atual modo-bot"
          >
            🤖 Atendimento automático
          </div>

        </div>


        <div class="acoes-cabecalho">

          <select
            id="statusConversa"
            disabled
          >

            <option value="novo">
              Novo
            </option>

            <option value="em_atendimento">
              Em atendimento
            </option>

            <option value="aguardando_cliente">
              Aguardando cliente
            </option>

            <option value="finalizado">
              Finalizado
            </option>

          </select>


          <button
            id="editarNome"
            type="button"
            disabled
          >
            Editar nome
          </button>


          <button
            id="botaoModo"
            type="button"
            class="assumir"
            disabled
          >
            👤 Assumir atendimento
          </button>

        </div>

      </div>


      <div
        class="mensagens"
        id="mensagens"
      >

        <div class="vazio">

          <h3>
            Caixa de atendimento
          </h3>

          <p>
            As conversas dos clientes aparecerão aqui.
          </p>

        </div>

      </div>


      <div class="resposta">

        <textarea
          id="mensagemResposta"
          placeholder="Digite uma mensagem..."
          disabled
        ></textarea>

        <button
          id="botaoEnviar"
          disabled
        >
          Enviar
        </button>

      </div>

    </div>

  </div>

</div>


<script>

let telefoneSelecionado = "";

let nomeSelecionado = "";

let assinaturaHistorico = "";

let atualizando = false;

let enviando = false;

let modoSelecionado = "bot";


// ===========================================================
// LOGIN
// ===========================================================

async function verificarLogin() {
  try {
    const resposta =
      await fetch(
        "/api/panel-login",
        {
          method: "GET",
          credentials: "same-origin"
        }
      );

    const dados =
      await resposta.json();

    if (!dados.autenticado) {
      window.location.href =
        "/painel.html";

      return false;
    }

    return true;

  } catch {
    window.location.href =
      "/painel.html";

    return false;
  }
}


// ===========================================================
// AUXILIARES
// ===========================================================

function pegarInicial(nome) {
  const texto =
    String(
      nome || "?"
    ).trim();

  return texto
    ? texto.charAt(0).toUpperCase()
    : "?";
}


function escaparHTML(valor) {
  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    valor || "";

  return div.innerHTML;
}


function formatarHora(data) {
  if (!data) {
    return "";
  }

  const objeto =
    new Date(data);

  if (
    Number.isNaN(
      objeto.getTime()
    )
  ) {
    return "";
  }

  return objeto
    .toLocaleTimeString(
      "pt-BR",
      {
        hour: "2-digit",
        minute: "2-digit"
      }
    );
}


function statusLabel(status) {
  const mapa = {
    novo:
      "Novo",

    em_atendimento:
      "Em atendimento",

    aguardando_cliente:
      "Aguardando cliente",

    finalizado:
      "Finalizado"
  };

  return mapa[status] || "Novo";
}


// ===========================================================
// MODO DE ATENDIMENTO NA TELA
// ===========================================================

function atualizarInterfaceModo(
  modo
) {
  modoSelecionado =
    modo || "bot";

  const indicador =
    document.getElementById(
      "modoAtual"
    );

  const botao =
    document.getElementById(
      "botaoModo"
    );


  if (
    modoSelecionado ===
    "humano"
  ) {
    indicador.textContent =
      "👤 Atendimento humano";

    indicador.className =
      "modo-atual modo-humano";

    botao.textContent =
      "🤖 Devolver ao bot";

    botao.className =
      "devolver";

  } else {
    indicador.textContent =
      "🤖 Atendimento automático";

    indicador.className =
      "modo-atual modo-bot";

    botao.textContent =
      "👤 Assumir atendimento";

    botao.className =
      "assumir";
  }
}


// ===========================================================
// ERRO
// ===========================================================

function mostrarErro(texto) {
  const el =
    document.getElementById(
      "erroTopo"
    );

  el.textContent =
    texto || "";

  el.style.display =
    texto
      ? "block"
      : "none";
}


// ===========================================================
// BUSCA
// ===========================================================

function aplicarBusca() {
  const termo =
    document
      .getElementById(
        "buscarCliente"
      )
      .value
      .toLowerCase()
      .trim();

  document
    .querySelectorAll(
      ".cliente"
    )
    .forEach(
      (cliente) => {
        cliente.style.display =
          cliente
            .textContent
            .toLowerCase()
            .includes(termo)
            ? "flex"
            : "none";
      }
    );
}


// ===========================================================
// CARREGAR CONVERSAS
// ===========================================================

async function carregarConversas() {
  const resposta =
    await fetch(
      "/api/conversations",
      {
        method: "GET",
        credentials: "same-origin"
      }
    );

  const dados =
    await resposta.json();

  if (
    !resposta.ok ||
    !dados.ok
  ) {
    throw new Error(
      dados.erro ||
      "Erro ao carregar conversas"
    );
  }

  const lista =
    document.getElementById(
      "listaClientes"
    );

  const conversas =
    dados.conversations ||
    [];

  if (!conversas.length) {
    lista.innerHTML =
      `
      <div
        style="
          padding:25px;
          text-align:center;
          color:#6b7280;
        "
      >
        Nenhuma conversa encontrada.
      </div>
      `;

    return;
  }

  const fragmento =
    document.createDocumentFragment();

  conversas.forEach(
    (conversa) => {
      const telefone =
        conversa.telefone ||
        "";

      const nome =
        conversa.nome ||
        telefone;

      const modo =
        conversa.modoAtendimento ||
        "bot";

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "cliente" +
        (
          telefone ===
          telefoneSelecionado
            ? " ativo"
            : ""
        );

      item.dataset.telefone =
        telefone;

      item.innerHTML =
        `
        <div class="avatar">
          ${escaparHTML(
            pegarInicial(nome)
          )}
        </div>

        <div class="dados-cliente">

          <div class="linha-nome">

            <strong>
              ${escaparHTML(nome)}
            </strong>

            ${
              Number(
                conversa.naoLidas ||
                0
              ) > 0

                ? `
                  <span class="badge">
                    ${Number(
                      conversa.naoLidas
                    )}
                  </span>
                `

                : ""
            }

          </div>

          <span class="preview">
            ${escaparHTML(
              conversa.ultimaMensagem ||
              ""
            )}
          </span>

          <div class="meta-cliente">

            <span class="status-mini">
              ${escaparHTML(
                statusLabel(
                  conversa.status
                )
              )}
            </span>

            <span
              class="modo-mini ${
                modo === "humano"
                  ? "modo-humano"
                  : "modo-bot"
              }"
            >
              ${
                modo === "humano"
                  ? "👤 Humano"
                  : "🤖 Bot"
              }
            </span>

            <span>
              ${escaparHTML(
                formatarHora(
                  conversa.atualizadoEm
                )
              )}
            </span>

          </div>

        </div>
        `;

      item.addEventListener(
        "click",
        () =>
          abrirConversa(
            telefone,
            nome,
            item,
            true
          )
      );

      fragmento.appendChild(
        item
      );
    }
  );

  lista.replaceChildren(
    fragmento
  );

  aplicarBusca();
}


// ===========================================================
// MARCAR LIDA
// ===========================================================

async function marcarComoLida(
  telefone
) {
  try {
    await fetch(
      "/api/conversations",
      {
        method: "POST",

        credentials:
          "same-origin",

        headers: {
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify({
            acao:
              "marcar_lida",

            telefone
          })
      }
    );

  } catch (erro) {
    console.error(
      "Erro ao marcar como lida:",
      erro
    );
  }
}


// ===========================================================
// HISTÓRICO
// ===========================================================

async function buscarHistorico(
  telefone,
  forcarRolagem = false
) {
  const area =
    document.getElementById(
      "mensagens"
    );

  const pertoDoFim =
    area.scrollHeight -
    area.scrollTop -
    area.clientHeight <
    120;

  const resposta =
    await fetch(
      `/api/conversations?telefone=${encodeURIComponent(
        telefone
      )}`,
      {
        credentials:
          "same-origin"
      }
    );

  const dados =
    await resposta.json();

  if (
    !resposta.ok ||
    !dados.ok
  ) {
    throw new Error(
      dados.erro ||
      "Erro ao carregar histórico"
    );
  }

  const mensagens =
    dados.mensagens ||
    [];

  const assinaturaNova =
    mensagens
      .map(
        (m) =>
          `${m.timestamp}|${m.direcao}|${m.texto}`
      )
      .join("§");

  if (
    assinaturaNova !==
    assinaturaHistorico
  ) {
    assinaturaHistorico =
      assinaturaNova;

    if (!mensagens.length) {
      area.innerHTML =
        `
        <div class="vazio">
          Nenhuma mensagem encontrada.
        </div>
        `;

    } else {
      const fragmento =
        document
          .createDocumentFragment();

      mensagens.forEach(
        (mensagem) => {
          const bolha =
            document.createElement(
              "div"
            );

          bolha.className =
            mensagem.direcao ===
            "saida"

              ? "mensagem atendente-msg"

              : "mensagem cliente-msg";

          bolha.innerHTML =
            `
            ${escaparHTML(
              mensagem.texto ||
              ""
            )}

            <span class="hora">
              ${escaparHTML(
                formatarHora(
                  mensagem.data
                )
              )}
            </span>
            `;

          fragmento.appendChild(
            bolha
          );
        }
      );

      area.replaceChildren(
        fragmento
      );
    }

    if (
      forcarRolagem ||
      pertoDoFim
    ) {
      area.scrollTop =
        area.scrollHeight;
    }
  }

  const conversa =
    dados.conversa ||
    {};

  if (
    telefone ===
    telefoneSelecionado
  ) {
    nomeSelecionado =
      conversa.nome ||
      nomeSelecionado ||
      telefone;

    document
      .getElementById(
        "nomeConversa"
      )
      .textContent =
        nomeSelecionado;

    document
      .getElementById(
        "avatarConversa"
      )
      .textContent =
        pegarInicial(
          nomeSelecionado
        );

    document
      .getElementById(
        "statusConversa"
      )
      .value =
        conversa.status ||
        "novo";

    atualizarInterfaceModo(
      conversa.modoAtendimento ||
      "bot"
    );
  }
}


// ===========================================================
// ABRIR CONVERSA
// ===========================================================

async function abrirConversa(
  telefone,
  nome,
  elemento,
  marcarLida = true
) {
  telefoneSelecionado =
    telefone;

  nomeSelecionado =
    nome ||
    telefone;

  assinaturaHistorico =
    "";

  document
    .querySelectorAll(
      ".cliente"
    )
    .forEach(
      (item) =>
        item
          .classList
          .remove(
            "ativo"
          )
    );

  if (elemento) {
    elemento
      .classList
      .add(
        "ativo"
      );
  }

  document
    .getElementById(
      "nomeConversa"
    )
    .textContent =
      nomeSelecionado;

  document
    .getElementById(
      "telefoneConversa"
    )
    .textContent =
      telefone;

  document
    .getElementById(
      "avatarConversa"
    )
    .textContent =
      pegarInicial(
        nomeSelecionado
      );

  document
    .getElementById(
      "mensagemResposta"
    )
    .disabled =
      false;

  document
    .getElementById(
      "botaoEnviar"
    )
    .disabled =
      false;

  document
    .getElementById(
      "statusConversa"
    )
    .disabled =
      false;

  document
    .getElementById(
      "editarNome"
    )
    .disabled =
      false;

  document
    .getElementById(
      "botaoModo"
    )
    .disabled =
      false;

  try {
    mostrarErro("");

    await buscarHistorico(
      telefone,
      true
    );

    if (marcarLida) {
      await marcarComoLida(
        telefone
      );

      await carregarConversas();
    }

    document
      .getElementById(
        "mensagemResposta"
      )
      .focus();

  } catch (erro) {
    console.error(
      "Erro ao abrir conversa:",
      erro
    );

    mostrarErro(
      "Não foi possível carregar esta conversa."
    );
  }
}


// ===========================================================
// ENVIAR MENSAGEM
// ===========================================================

async function enviarMensagem() {
  if (
    enviando ||
    !telefoneSelecionado
  ) {
    return;
  }

  const campo =
    document.getElementById(
      "mensagemResposta"
    );

  const botao =
    document.getElementById(
      "botaoEnviar"
    );

  const texto =
    campo.value.trim();

  if (!texto) {
    return;
  }

  enviando =
    true;

  botao.disabled =
    true;

  botao.textContent =
    "Enviando...";

  try {
    mostrarErro("");

    const resposta =
      await fetch(
        "/api/send-message",
        {
          method:
            "POST",

          credentials:
            "same-origin",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              telefone:
                telefoneSelecionado,

              texto
            })
        }
      );

    const dados =
      await resposta.json();

    if (
      !resposta.ok ||
      !dados.ok
    ) {
      throw new Error(
        dados.erro ||
        "Erro ao enviar mensagem"
      );
    }

    campo.value =
      "";

    assinaturaHistorico =
      "";

    await buscarHistorico(
      telefoneSelecionado,
      true
    );

    await carregarConversas();

  } catch (erro) {
    console.error(
      "Erro ao enviar pelo CRM:",
      erro
    );

    mostrarErro(
      erro.message ||
      "Não foi possível enviar a mensagem."
    );

  } finally {
    enviando =
      false;

    botao.disabled =
      false;

    botao.textContent =
      "Enviar";

    campo.focus();
  }
}


// ===========================================================
// ALTERAR MODO BOT/HUMANO
// ===========================================================

async function alternarModoAtendimento() {
  if (!telefoneSelecionado) {
    return;
  }

  const botao =
    document.getElementById(
      "botaoModo"
    );

  botao.disabled =
    true;

  const acao =
    modoSelecionado ===
    "humano"
      ? "devolver_bot"
      : "assumir_atendimento";

  try {
    mostrarErro("");

    const resposta =
      await fetch(
        "/api/conversations",
        {
          method: "POST",

          credentials:
            "same-origin",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              acao,
              telefone:
                telefoneSelecionado
            })
        }
      );

    const dados =
      await resposta.json();

    if (
      !resposta.ok ||
      !dados.ok
    ) {
      throw new Error(
        dados.erro ||
        "Erro ao alterar atendimento"
      );
    }

    atualizarInterfaceModo(
      dados.conversa
        ?.modoAtendimento ||
      "bot"
    );

    if (
      dados.conversa
        ?.status
    ) {
      document
        .getElementById(
          "statusConversa"
        )
        .value =
          dados.conversa.status;
    }

    await carregarConversas();

  } catch (erro) {
    mostrarErro(
      erro.message ||
      "Não foi possível alterar o modo de atendimento."
    );

  } finally {
    botao.disabled =
      false;
  }
}


// ===========================================================
// STATUS
// ===========================================================

async function atualizarStatus() {
  if (!telefoneSelecionado) {
    return;
  }

  const status =
    document
      .getElementById(
        "statusConversa"
      )
      .value;

  try {
    const resposta =
      await fetch(
        "/api/conversations",
        {
          method:
            "POST",

          credentials:
            "same-origin",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              acao:
                "atualizar_status",

              telefone:
                telefoneSelecionado,

              status
            })
        }
      );

    const dados =
      await resposta.json();

    if (
      !resposta.ok ||
      !dados.ok
    ) {
      throw new Error(
        dados.erro ||
        "Erro ao atualizar status"
      );
    }

    await carregarConversas();

  } catch (erro) {
    mostrarErro(
      erro.message ||
      "Não foi possível atualizar o status."
    );
  }
}


// ===========================================================
// EDITAR NOME
// ===========================================================

async function editarNome() {
  if (!telefoneSelecionado) {
    return;
  }

  const novoNome =
    prompt(
      "Nome do cliente:",
      nomeSelecionado ||
      telefoneSelecionado
    );

  if (
    novoNome === null
  ) {
    return;
  }

  try {
    const resposta =
      await fetch(
        "/api/conversations",
        {
          method:
            "POST",

          credentials:
            "same-origin",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              acao:
                "atualizar_nome",

              telefone:
                telefoneSelecionado,

              nome:
                novoNome
            })
        }
      );

    const dados =
      await resposta.json();

    if (
      !resposta.ok ||
      !dados.ok
    ) {
      throw new Error(
        dados.erro ||
        "Erro ao atualizar nome"
      );
    }

    nomeSelecionado =
      dados.conversa
        ?.nome ||
      telefoneSelecionado;

    document
      .getElementById(
        "nomeConversa"
      )
      .textContent =
        nomeSelecionado;

    document
      .getElementById(
        "avatarConversa"
      )
      .textContent =
        pegarInicial(
          nomeSelecionado
        );

    await carregarConversas();

  } catch (erro) {
    mostrarErro(
      erro.message ||
      "Não foi possível atualizar o nome."
    );
  }
}


// ===========================================================
// ATUALIZAÇÃO AUTOMÁTICA
// ===========================================================

async function atualizarAutomaticamente() {
  if (
    atualizando ||
    enviando
  ) {
    return;
  }

  atualizando =
    true;

  try {
    document
      .getElementById(
        "estadoAtualizacao"
      )
      .textContent =
        "Atualizando...";

    await carregarConversas();

    if (
      telefoneSelecionado
    ) {
      await buscarHistorico(
        telefoneSelecionado,
        false
      );
    }

    document
      .getElementById(
        "estadoAtualizacao"
      )
      .textContent =
        "Atualização automática ativa";

  } catch (erro) {
    console.error(
      "Erro na atualização automática:",
      erro
    );

    document
      .getElementById(
        "estadoAtualizacao"
      )
      .textContent =
        "Falha temporária na atualização";

  } finally {
    atualizando =
      false;
  }
}


// ===========================================================
// EVENTOS
// ===========================================================

document
  .getElementById(
    "buscarCliente"
  )
  .addEventListener(
    "input",
    aplicarBusca
  );


document
  .getElementById(
    "botaoEnviar"
  )
  .addEventListener(
    "click",
    enviarMensagem
  );


document
  .getElementById(
    "statusConversa"
  )
  .addEventListener(
    "change",
    atualizarStatus
  );


document
  .getElementById(
    "editarNome"
  )
  .addEventListener(
    "click",
    editarNome
  );


document
  .getElementById(
    "botaoModo"
  )
  .addEventListener(
    "click",
    alternarModoAtendimento
  );


document
  .getElementById(
    "mensagemResposta"
  )
  .addEventListener(
    "keydown",
    (event) => {
      if (
        event.key ===
          "Enter" &&
        !event.shiftKey
      ) {
        event.preventDefault();

        enviarMensagem();
      }
    }
  );


// ===========================================================
// INICIALIZAÇÃO
// ===========================================================

async function iniciarConversas() {
  const autenticado =
    await verificarLogin();

  if (!autenticado) {
    return;
  }

  try {
    await carregarConversas();

  } catch (erro) {
    console.error(
      erro
    );

    mostrarErro(
      "Não foi possível carregar as conversas."
    );
  }

  setInterval(
    atualizarAutomaticamente,
    5000
  );
}


iniciarConversas();

</script>

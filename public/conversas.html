<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversas | ADCred</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f3f5f8;
      color: #1f2937;
    }

    header {
      height: 70px;
      background: #111827;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px;
    }

    header h1 {
      font-size: 22px;
    }

    .voltar {
      color: white;
      text-decoration: none;
      background: #273244;
      padding: 10px 16px;
      border-radius: 7px;
    }

    .container {
      max-width: 1450px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .titulo {
      margin-bottom: 20px;
    }

    .titulo h2 {
      font-size: 28px;
      margin-bottom: 5px;
    }

    .titulo p {
      color: #6b7280;
    }

    .chat {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,.08);
      display: grid;
      grid-template-columns: 360px 1fr;
      height: 680px;
    }

    /* COLUNA DOS CLIENTES */

    .clientes {
      border-right: 1px solid #e5e7eb;
      overflow-y: auto;
    }

    .busca {
      padding: 15px;
      border-bottom: 1px solid #e5e7eb;
    }

    .busca input {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      outline: none;
    }

    .cliente {
      padding: 17px;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .cliente:hover {
      background: #f8fafc;
    }

    .cliente.ativo {
      background: #eef4ff;
    }

    .avatar {
      width: 45px;
      height: 45px;
      background: #1f2937;
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      flex-shrink: 0;
    }

    .dados-cliente {
      min-width: 0;
      flex: 1;
    }

    .dados-cliente strong {
      display: block;
      margin-bottom: 5px;
    }

    .dados-cliente span {
      display: block;
      font-size: 13px;
      color: #6b7280;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* CONVERSA */

    .conversa {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .cabecalho-conversa {
      height: 75px;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 12px;
    }

    .cabecalho-conversa strong {
      display: block;
    }

    .cabecalho-conversa span {
      font-size: 13px;
      color: #6b7280;
    }

    .mensagens {
      flex: 1;
      background: #f7f8fa;
      padding: 25px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .vazio {
      margin: auto;
      text-align: center;
      color: #6b7280;
    }

    .vazio h3 {
      color: #374151;
      margin-bottom: 8px;
    }

    .mensagem {
      max-width: 70%;
      padding: 11px 14px;
      border-radius: 10px;
      line-height: 1.4;
      font-size: 14px;
    }

    .mensagem.cliente-msg {
      background: white;
      align-self: flex-start;
      border: 1px solid #e5e7eb;
    }

    .mensagem.atendente-msg {
      background: #d9fdd3;
      align-self: flex-end;
    }

    .hora {
      display: block;
      font-size: 10px;
      color: #6b7280;
      margin-top: 5px;
      text-align: right;
    }

    /* CAMPO DE RESPOSTA */

    .resposta {
      border-top: 1px solid #e5e7eb;
      padding: 15px;
      display: flex;
      gap: 10px;
      background: white;
    }

    .resposta textarea {
      flex: 1;
      resize: none;
      height: 48px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 12px;
      outline: none;
    }

    .resposta button {
      border: 0;
      background: #1f2937;
      color: white;
      padding: 0 22px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .resposta button:hover {
      background: #111827;
    }

    @media (max-width: 800px) {
      .chat {
        grid-template-columns: 1fr;
      }

      .clientes {
        display: none;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>ADCred | Atendimento</h1>

  <a class="voltar" href="/painel.html">
    Voltar ao painel
  </a>
</header>

<div class="container">

  <div class="titulo">
    <h2>Conversas</h2>
    <p>Atendimento dos clientes pelo WhatsApp</p>
  </div>

  <div class="chat">

    <div class="clientes">

      <div class="busca">
        <input
          type="text"
          id="buscarCliente"
          placeholder="Buscar cliente ou telefone..."
        >
      </div>

      <div id="listaClientes">

        <div style="padding:25px;text-align:center;color:#6b7280;">
          Nenhuma conversa carregada.
        </div>

      </div>

    </div>

    <div class="conversa">

      <div class="cabecalho-conversa">

        <div class="avatar" id="avatarConversa">
          ?
        </div>

        <div>
          <strong id="nomeConversa">
            Selecione uma conversa
          </strong>

          <span id="telefoneConversa">
            WhatsApp
          </span>
        </div>

      </div>

      <div class="mensagens" id="mensagens">

        <div class="vazio">
          <h3>Caixa de atendimento</h3>
          <p>
            As conversas dos clientes aparecerão aqui.
          </p>
        </div>

      </div>

      <div class="resposta">

        <textarea
          id="mensagemResposta"
          placeholder="Digite uma mensagem..."
          
        ></textarea>

        <button
          id="botaoEnviar"
          
        >
          Enviar
        </button>

      </div>

    </div>

  </div>

</div>

<script>
  async function verificarLogin() {
  try {
    const resposta = await fetch(
      "/api/panel-login",
      {
        method: "GET",
        credentials: "same-origin"
      }
    );

    const dados = await resposta.json();

    if (!dados.autenticado) {
      window.location.href = "/painel.html";
      return false;
    }

    return true;

  } catch (erro) {
    window.location.href = "/painel.html";
    return false;
  }
}


// ===========================================================
// CARREGAR LISTA DE CONVERSAS
// ===========================================================

async function carregarConversas() {

  const lista =
    document.getElementById(
      "listaClientes"
    );

  try {

    const resposta = await fetch(
      "/api/conversations",
      {
        method: "GET",
        credentials: "same-origin"
      }
    );

    const dados =
      await resposta.json();

    if (!resposta.ok || !dados.ok) {
      throw new Error(
        dados.erro ||
        "Erro ao carregar conversas"
      );
    }

    const conversas =
      dados.conversations || [];

    if (conversas.length === 0) {

      lista.innerHTML = `
        <div style="
          padding:25px;
          text-align:center;
          color:#6b7280;
        ">
          Nenhuma conversa encontrada.
        </div>
      `;

      return;
    }

    lista.innerHTML = "";

    conversas.forEach(
      conversa => {

        const telefone =
          conversa.telefone || "";

        const nome =
          conversa.nome ||
          telefone;

        const ultimaMensagem =
          conversa.ultimaMensagem ||
          "";

        const item =
          document.createElement(
            "div"
          );

        item.className =
          "cliente";

        item.dataset.telefone =
          telefone;

        item.innerHTML = `
          <div class="avatar">
            ${pegarInicial(nome)}
          </div>

          <div class="dados-cliente">
            <strong>
              ${escaparHTML(nome)}
            </strong>

            <span>
              ${escaparHTML(ultimaMensagem)}
            </span>
          </div>
        `;

        item.addEventListener(
          "click",
          () => abrirConversa(
            telefone,
            nome,
            item
          )
        );

        lista.appendChild(item);
      }
    );

  } catch (erro) {

    console.error(
      "Erro ao carregar conversas:",
      erro
    );

    lista.innerHTML = `
      <div style="
        padding:25px;
        text-align:center;
        color:#b00020;
      ">
        Não foi possível carregar as conversas.
      </div>
    `;
  }
}


// ===========================================================
// ABRIR HISTÓRICO DO CLIENTE
// ===========================================================

async function abrirConversa(
  telefone,
  nome,
  elemento
) {

  document
    .querySelectorAll(".cliente")
    .forEach(item =>
      item.classList.remove(
        "ativo"
      )
    );

  if (elemento) {
    elemento.classList.add(
      "ativo"
    );
  }

  document.getElementById(
    "nomeConversa"
  ).textContent = nome;

  document.getElementById(
    "telefoneConversa"
  ).textContent = telefone;

  document.getElementById(
    "avatarConversa"
  ).textContent =
    pegarInicial(nome);

  const areaMensagens =
    document.getElementById(
      "mensagens"
    );

  areaMensagens.innerHTML =
    "<div class='vazio'>Carregando conversa...</div>";

  try {

    const resposta =
      await fetch(
        `/api/conversations?telefone=${encodeURIComponent(telefone)}`,
        {
          credentials:
            "same-origin"
        }
      );

    const dados =
      await resposta.json();

    if (!resposta.ok || !dados.ok) {
      throw new Error(
        dados.erro ||
        "Erro ao carregar histórico"
      );
    }

    const mensagens =
      dados.mensagens || [];

    areaMensagens.innerHTML = "";

    if (mensagens.length === 0) {

      areaMensagens.innerHTML = `
        <div class="vazio">
          Nenhuma mensagem encontrada.
        </div>
      `;

      return;
    }

    mensagens.forEach(
      mensagem => {

        const bolha =
          document.createElement(
            "div"
          );

        bolha.className =
          mensagem.direcao ===
          "saida"
            ? "mensagem atendente-msg"
            : "mensagem cliente-msg";

        const hora =
          formatarHora(
            mensagem.data
          );

        bolha.innerHTML = `
          ${escaparHTML(
            mensagem.texto || ""
          )}

          <span class="hora">
            ${hora}
          </span>
        `;

        areaMensagens.appendChild(
          bolha
        );
      }
    );

    areaMensagens.scrollTop =
      areaMensagens.scrollHeight;

  } catch (erro) {

    console.error(
      "Erro ao abrir conversa:",
      erro
    );

    areaMensagens.innerHTML = `
      <div class="vazio">
        Não foi possível carregar esta conversa.
      </div>
    `;
  }
}


// ===========================================================
// FUNÇÕES AUXILIARES
// ===========================================================

function pegarInicial(nome) {

  const texto =
    String(nome || "?").trim();

  return texto
    ? texto.charAt(0).toUpperCase()
    : "?";
}


function formatarHora(data) {

  if (!data) {
    return "";
  }

  const objeto =
    new Date(data);

  if (
    Number.isNaN(
      objeto.getTime()
    )
  ) {
    return "";
  }

  return objeto.toLocaleTimeString(
    "pt-BR",
    {
      hour: "2-digit",
      minute: "2-digit"
    }
  );
}


function escaparHTML(valor) {

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    valor || "";

  return div.innerHTML;
}


// ===========================================================
// BUSCA
// ===========================================================

document
  .getElementById(
    "buscarCliente"
  )
  .addEventListener(
    "input",
    function () {

      const termo =
        this.value
          .toLowerCase()
          .trim();

      document
        .querySelectorAll(
          ".cliente"
        )
        .forEach(
          cliente => {

            const texto =
              cliente.textContent
                .toLowerCase();

            cliente.style.display =
              texto.includes(termo)
                ? "flex"
                : "none";
          }
        );
    }
  );


// ===========================================================
// ENVIAR MENSAGEM PELO CRM
// ===========================================================

document
  .getElementById("botaoEnviar")
  .addEventListener(
    "click",
    async function () {

      const telefone =
        document
          .getElementById(
            "telefoneConversa"
          )
          .textContent
          .trim();

      const campo =
        document.getElementById(
          "mensagemResposta"
        );

      const texto =
        campo.value.trim();

      if (
        !telefone ||
        telefone === "WhatsApp" ||
        !texto
      ) {
        return;
      }

      this.disabled = true;

      try {
        const resposta =
          await fetch(
            "/api/send-message",
            {
              method: "POST",
              credentials:
                "same-origin",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  telefone,
                  texto
                })
            }
          );

        const dados =
          await resposta.json();

        if (
          !resposta.ok ||
          !dados.ok
        ) {
          throw new Error(
            dados.erro ||
            "Erro ao enviar mensagem"
          );
        }

        campo.value = "";

        // Atualiza o histórico
        const itemAtivo =
          document.querySelector(
            ".cliente.ativo"
          );

        await abrirConversa(
          telefone,
          document
            .getElementById(
              "nomeConversa"
            )
            .textContent,
          itemAtivo
        );

        // Atualiza lista lateral
        await carregarConversas();

      } catch (erro) {
        console.error(
          "Erro ao enviar pelo CRM:",
          erro
        );

        alert(
          "Não foi possível enviar a mensagem."
        );

      } finally {
        this.disabled = false;
        campo.focus();
      }
    }
  );
  // ===========================================================
// INICIAR
// ===========================================================

async function iniciarConversas() {

  const autenticado =
    await verificarLogin();

  if (!autenticado) {
    return;
  }

  await carregarConversas();
}

iniciarConversas();
</script>
</body>
</html>
